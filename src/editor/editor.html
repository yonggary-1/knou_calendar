<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>과제 메모 — Knou calendar</title>
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="bar">
    <div class="wrap bar-in">
      <div class="title">
        <img src="../icons/icon32.png" alt="" width="22" height="22">
        <div>
          <h1>과제 메모</h1>
          <p class="muted small" id="where">Dropbox › Apps › KnouWidget › knou_scope.txt</p>
        </div>
      </div>
      <div class="acts">
        <span id="state" class="muted small" aria-live="polite"></span>
        <button id="btnReload">다시 불러오기</button>
        <button id="btnSave" class="primary" disabled>저장</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="banner" hidden></div>
    <p class="muted small" id="help">과목마다 중간평가·기말평가·과목 메모를 적습니다. 서식 없는 글자만 저장되며, 아이패드 위젯과 메모장에서 고친 내용과 같은 파일입니다. 저장하면 위젯에 바로 반영되고, 구글 캘린더 설명란에는 다음 동기화 때 반영됩니다.</p>
    <nav id="jump" class="jump" aria-label="과목으로 이동"></nav>
    <div id="list"></div>
  </main>

  <script src="../lib/env.js"></script>
  <script src="../lib/core.js"></script>
  <script src="../ui/dom.js"></script>
  <script src="editor.js"></script>
</body>
</html>
