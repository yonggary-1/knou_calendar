<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>과제 메모 — Knou calendar</title>
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="bar">
    <div class="wrap bar-in">
      <div class="title">
        <img src="../icons/icon32.png" alt="" width="22" height="22">
        <div>
          <h1>과제 메모</h1>
          <p class="muted small" id="where"></p>
        </div>
      </div>
      <div class="acts">
        <span id="state" class="muted small" aria-live="polite"></span>
        <button id="btnExport" disabled title="화면의 내용을 txt 파일로 저장합니다 (저장 위치를 묻습니다)">txt 내보내기</button>
        <button id="btnReload">다시 불러오기</button>
        <button id="btnSave" class="primary" disabled>저장</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="banner" hidden></div>
    <p class="muted small" id="help"></p>
    <nav id="jump" class="jump" aria-label="과목으로 이동"></nav>
    <div id="list"></div>
  </main>

  <script src="../lib/env.js"></script>
  <script src="../lib/core.js"></script>
  <script src="../ui/dom.js"></script>
  <script src="../lib/scope.js"></script>
  <script src="editor.js"></script>
</body>
</html>
