<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Knou calendar</title>
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="20" height="20">
      <span>Knou calendar</span>
    </div>
    <button id="btnOptions" class="ghost icon" title="설정" aria-label="설정">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L14.9 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.4 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.9h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM12.9 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
    </button>
  </header>

  <section class="status" aria-label="연결 상태">
    <div class="row">
      <span class="dot" id="knouDot"></span>
      <span class="label">방통대</span>
      <span class="value" id="knouText">확인 전</span>
      <button id="btnKnou" class="link" hidden>열기</button>
    </div>
    <div class="row">
      <span class="dot" id="googleDot"></span>
      <span class="label">구글</span>
      <span class="value" id="googleText">연결 안 됨</span>
      <button id="btnGoogle" class="link">연결</button>
    </div>
  </section>

  <main id="panel" class="panel" aria-live="polite"></main>

  <nav class="links" aria-label="바로가기">
    <button data-href="https://m.knou.ac.kr/">MyKNOU 열기 ↗</button>
    <button data-href="https://calendar.google.com/">구글 캘린더 ↗</button>
  </nav>

  <script src="../lib/env.js"></script>
  <script src="../lib/core.js"></script>
  <script src="../ui/dom.js"></script>
  <script src="popup.js"></script>
</body>
</html>
